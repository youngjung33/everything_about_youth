<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="청년의 모든 것 - 청년이 이용할 수 있는 모든 정보">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="청년의 모든 것">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>청년의 모든 것</title>
  <link rel="manifest" href="manifest.json">

  <!-- Flutter 엔진이 뜨기 전에 보이는 로딩 화면. 앱의 스플래시(SplashPage)와 같은 배치로 이어진다. -->
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #boot {
      position: fixed; inset: 0; z-index: 10; background: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      transition: opacity .25s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    /* #boot-brand: 로고/문구 자리. 지금은 비워 둔다. (앱의 SplashBrand 와 같이 바꾼다) */
    #boot-brand { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #boot .spinner {
      margin-bottom: 56px; width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid #dbe4fb; border-top-color: #2563EB;
      animation: boot-spin .8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="불러오는 중">
    <div id="boot-brand"></div>
    <div class="spinner"></div>
  </div>
  <script>
    // Flutter 가 첫 화면을 그리면 로딩 화면을 부드럽게 걷어낸다.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('hide');
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
